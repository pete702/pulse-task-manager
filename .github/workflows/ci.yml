name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    needs: fmt
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run Clippy (deny warnings)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run cargo check (stable)
        run: cargo check --locked --all-targets
      - name: Run unit tests
        run: cargo test --locked --all-targets
      - name: Build release
        run: cargo build --release --locked
      - name: Run self-test (headless CI mode)
        run: cargo run --release --locked -- --self-test
        env:
          CI: true
      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: pulse-${{ github.sha }}
          path: target/release/pulse_manager.exe
          retention-days: 7

  msrv:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-
      - name: Run cargo check (stable)
        run: cargo check --locked --all-targets
      - name: Run Clippy (stable)
        run: cargo clippy --locked --all-targets -- -D warnings