[package]
name = "pulse_manager"
version = "0.1.17"
edition = "2021"
rust-version = "1.85"
description = "Windows 10/11 hardware telemetry HUD and process manager in Rust + egui"
license = "MIT"
repository = "https://github.com/pete702/pulse-task-manager"
homepage = "https://github.com/pete702/pulse-task-manager/releases"
readme = "README.md"
keywords = ["system-monitor", "task-manager", "windows", "rust", "egui", "telemetry"]
categories = ["command-line-utilities", "gui", "system-tools"]
authors = ["pete702"]

[workspace]
resolver = "2"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 1
debug = true

[dependencies]
# =============================================================================
# GUI FRAMEWORK (eframe/egui 0.27.2 - PINNED EXACTLY)
# =============================================================================
eframe = "=0.27.2"
egui = "=0.27.2"
egui_plot = "=0.27.2"
egui_extras = "=0.27.2"

# =============================================================================
# SYSTEM INTELLIGENCE (sysinfo 0.30.12 - PINNED EXACTLY)
# =============================================================================
sysinfo = { version = "=0.30.12", default-features = false }

# =============================================================================
# WINDOWS NATIVE API (windows-sys 0.52.0 - PINNED EXACTLY)
# Features: ProcessStatus (PSAPI), Threading, Foundation, Globalization
# =============================================================================
windows-sys = { version = "=0.52.0", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Foundation", "Win32_Globalization", "Win32_Security"] }

# =============================================================================
# TRANSITIVE DEPENDENCY PINS (for MSRV 1.78 compatibility)
# =============================================================================
# url 2.5.x pulls in idna 1.1+ which requires edition2024 (Rust 1.85+)
# Pin to 2.4.0 which works with Rust 1.78
url = "=2.4.0"

[dev-dependencies]

[features]
default = []