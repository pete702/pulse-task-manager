[package]
name = "pulse_manager"
version = "0.0.11"
edition = "2021"
description = "⚡ PULSE // Next-Gen System Telemetry for Windows — modular task manager in Rust + egui"
license = "MIT"
repository = "https://github.com/pulse-manager/pulse_manager"
readme = "README.md"
keywords = ["system-monitor", "task-manager", "windows", "rust", "egui", "telemetry"]
categories = ["command-line-utilities", "gui", "system-tools"]

[workspace]
resolver = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 1
debug = true

[dependencies]
# =============================================================================
# GUI FRAMEWORK (eframe/egui 0.27.2 - PINNED EXACTLY)
# =============================================================================
eframe = "0.27.2"
egui = "0.27.2"
egui_plot = "0.27.2"
egui_extras = "0.27.2"

# =============================================================================
# SYSTEM INTELLIGENCE (sysinfo 0.30.12 - PINNED EXACTLY)
# =============================================================================
sysinfo = { version = "=0.30.12", default-features = false }

# =============================================================================
# WINDOWS NATIVE API (windows-sys 0.52.0 - PINNED EXACTLY)
# Features: ProcessStatus (PSAPI), Threading, Foundation
# =============================================================================
windows-sys = { version = "0.52.0", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Foundation", "Win32_Globalization"] }

# =============================================================================
# UTILITIES
# =============================================================================
# System time / formatting
chrono = "0.4.38"
# Serialization for settings/config
serde = { version = "1.0.208", features = ["derive"] }
serde_json = "1.0.123"
# Logging
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt"] }
# Async runtime for background data collection
tokio = { version = "1.40.1", features = ["rt-multi-thread", "macros", "sync", "time"] }


[dev-dependencies]
# Property-based testing
proptest = "1.4.0"

[features]
default = []