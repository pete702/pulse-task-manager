[package]
name = "pulse_manager"
version = "0.4.29"
edition = "2021"
rust-version = "1.88"
description = "Windows 10/11 hardware telemetry HUD and process manager in Rust + egui"
license = "MIT"
repository = "https://github.com/pete702/pulse-task-manager"
homepage = "https://github.com/pete702/pulse-task-manager/releases"
readme = "README.md"
keywords = ["system-monitor", "task-manager", "windows", "rust", "egui", "telemetry"]
categories = ["gui", "system-tools"]
authors = ["pete702"]

[workspace]
resolver = "2"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 1
debug = true

[dependencies]
# =============================================================================
# GUI FRAMEWORK (eframe/egui 0.27.2 - PINNED EXACTLY)
# =============================================================================
eframe = "=0.27.2"
egui = "=0.27.2"
egui_plot = "=0.27.2"
egui_extras = "=0.27.2"

# =============================================================================
# SYSTEM INTELLIGENCE (sysinfo 0.30.12 - PINNED EXACTLY)
# =============================================================================
sysinfo = { version = "=0.30.12", default-features = false }

# =============================================================================
# WINDOWS NATIVE API (windows-sys 0.52.0 - PINNED EXACTLY)
# Features: ProcessStatus (PSAPI), Threading, Foundation, Globalization, Power, Registry, SystemInformation
# =============================================================================
windows-sys = { version = "=0.52.0", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_Power", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]

[features]
default = []